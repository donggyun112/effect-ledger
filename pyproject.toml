[project]
name = "effect-ledger"
version = "0.1.1"
description = "Composable effect recovery with atomic SQLite/PostgreSQL stores, host-owned identity and optional LangGraph/MCP adapters."
readme = "README.md"
authors = [
    { name = "donggyun112", email = "ssddgg99@daum.net" }
]
license = "MIT"
requires-python = ">=3.10"
keywords = ["langchain", "langgraph", "mcp", "postgresql", "agents", "durable-execution", "idempotency"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.scripts]
effect-ledger = "effect_ledger.cli:main"

[project.urls]
Source = "https://github.com/donggyun112/effect-ledger"

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
langchain = [
    "langchain>=1.4.0",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3,<4",
]
mcp = [
    "mcp>=1.28,<2",
]

[dependency-groups]
dev = ["ruff==0.16.6"]

[tool.ruff]
# probes/ is the design record rather than maintained code. The README promises
# each file runs as-is, so reformatting them buys nothing and rewrites history.
extend-exclude = ["probes"]

[tool.ruff.lint]
# Deliberately narrow. F and E9 catch real defects; I, UP, B and RUF100 keep the
# source consistent. BLE001 is left out on purpose: every blind except in src is
# a fail-closed boundary that turns an unknown outcome into an unresolved
# operation, which is the contract this library exists to enforce.
select = ["F", "E9", "I", "UP", "B", "RUF100"]

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
